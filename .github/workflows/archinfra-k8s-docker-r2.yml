name: Archinfra Kubernetes Docker Runtime r2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "archinfra/releases/v1.36.4-r2.env"
      - "archinfra/scripts/**"
      - "docker/**"
      - "registry/**"
      - "k8s/**"
      - ".github/workflows/archinfra-k8s-docker-r2.yml"
  push:
    branches:
      - main
    paths:
      - "archinfra/releases/v1.36.4-r2.env"
      - "archinfra/scripts/**"
      - "docker/**"
      - "registry/**"
      - "k8s/**"
      - ".github/workflows/archinfra-k8s-docker-r2.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: archinfra-kubernetes-runtime-v1.36.4-r2
  cancel-in-progress: false

env:
  RELEASE_FILE: ${{ github.workspace }}/archinfra/releases/v1.36.4-r2.env

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deterministic runtime release
        shell: bash
        run: |
          set -euo pipefail
          bash -n archinfra/scripts/build-k8s-docker.sh
          source archinfra/releases/v1.36.4-r2.env
          test "$RELEASE_VERSION" = "v1.36.4-r2"
          test "$ARCH" = "amd64" || test "$ARCH" = "arm64"
          test "$RUNTIME_PROFILE" = "docker"
          test "$KUBERNETES_VERSION" = "1.36.4"
          test "$SEALOS_VERSION" = "5.1.1"
          test "$DOCKER_VERSION" = "28.5.2"
          test "$CRI_DOCKERD_VERSION" = "0.4.6"
          test "$REGISTRY_VERSION" = "2.8.3"
          test "$SEALOS_CACHE_DIGEST" != ""
          test "$DOCKER_CACHE_DIGEST" != ""
          test "$CRICTL_CACHE_DIGEST" != ""
          test "$KUBERNETES_CACHE_DIGEST" != ""
          test "$FINAL_IMAGE_ARM64" != ""
          echo "release lock validation OK"

  build:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deterministic build host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            buildah \
            skopeo \
            jq \
            file \
            uidmap \
            fuse-overlayfs
          buildah --version
          skopeo --version
          jq --version

      - name: Build and publish Cluster Image to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: bash archinfra/scripts/build-k8s-docker.sh

      - name: Mirror verified Runtime image to Alibaba Cloud ACR
        if: ${{ vars.PUBLISH_ALIYUN == 'true' }}
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          set -euo pipefail

          _ARCH="${ARCH:-}"
          source archinfra/releases/v1.36.4-r2.env
          if [[ -n "$_ARCH" ]]; then ARCH="$_ARCH"; fi
          case "$ARCH" in
            amd64)
              ;;
            arm64)
              FINAL_IMAGE="$FINAL_IMAGE_ARM64"
              ;;
            *)
              echo "ERROR: unsupported mirror architecture: $ARCH" >&2
              exit 1
              ;;
          esac

          PROVENANCE="out/runtime-${RELEASE_VERSION}.provenance.env"
          test -s "$PROVENANCE"

          : "${ALIYUN_REGISTRY:?organization variable ALIYUN_REGISTRY is required}"
          : "${ALIYUN_NAMESPACE:?organization variable ALIYUN_NAMESPACE is required}"
          : "${ALIYUN_USERNAME:?organization secret ALIYUN_USERNAME is required}"
          : "${ALIYUN_PASSWORD:?organization secret ALIYUN_PASSWORD is required}"

          ALIYUN_IMAGE="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/kubernetes-runtime:${RELEASE_VERSION}-${ARCH}"

          SRC_DIGEST="$(skopeo inspect \
            --override-os linux --override-arch "$ARCH" \
            --creds "$GHCR_USER:$GHCR_TOKEN" \
            "docker://$FINAL_IMAGE" | jq -r '.Digest')"
          test "$SRC_DIGEST" = "$(grep '^FINAL_DIGEST=' "$PROVENANCE" | cut -d= -f2-)"

          echo "Mirroring:"
          echo "  source: $FINAL_IMAGE@$SRC_DIGEST"
          echo "  target: $ALIYUN_IMAGE"

          skopeo copy \
            --all \
            --preserve-digests \
            --src-creds "$GHCR_USER:$GHCR_TOKEN" \
            --dest-creds "$ALIYUN_USERNAME:$ALIYUN_PASSWORD" \
            "docker://$FINAL_IMAGE" \
            "docker://$ALIYUN_IMAGE"

          DST_DIGEST="$(skopeo inspect \
            --override-os linux --override-arch "$ARCH" \
            --creds "$ALIYUN_USERNAME:$ALIYUN_PASSWORD" \
            "docker://$ALIYUN_IMAGE" | jq -r '.Digest')"

          if [[ "$DST_DIGEST" != "$SRC_DIGEST" ]]; then
            echo "ERROR: Aliyun ACR digest mismatch: source=$SRC_DIGEST target=$DST_DIGEST" >&2
            exit 1
          fi

          cat >> "$PROVENANCE" <<EOF
          ALIYUN_MIRROR_STATUS=VERIFIED
          ALIYUN_REGISTRY=$ALIYUN_REGISTRY
          ALIYUN_NAMESPACE=$ALIYUN_NAMESPACE
          ALIYUN_IMAGE=$ALIYUN_IMAGE
          ALIYUN_DIGEST=$DST_DIGEST
          EOF

          {
            echo "## Alibaba Cloud ACR mirror"
            echo
            echo "- Image: \`$ALIYUN_IMAGE\`"
            echo "- Digest: \`$DST_DIGEST\`"
            echo "- Status: VERIFIED"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Aliyun ACR mirror VERIFIED: $ALIYUN_IMAGE@$DST_DIGEST"

      - name: Upload runtime provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-runtime-v1.36.4-r2-${{ matrix.arch }}-provenance
          path: out/
          if-no-files-found: warn

  publish-multiarch:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install manifest verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq
          docker buildx version

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified GHCR multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail
          source archinfra/releases/v1.36.4-r2.env

          AMD_IMAGE="$FINAL_IMAGE"
          ARM_IMAGE="$FINAL_IMAGE_ARM64"
          MULTI_IMAGE="${FINAL_IMAGE%-amd64}"

          AMD_INSPECT="$(docker buildx imagetools inspect "$AMD_IMAGE")"
          ARM_INSPECT="$(docker buildx imagetools inspect "$ARM_IMAGE")"
          AMD_DIGEST="$(printf '%s\n' "$AMD_INSPECT" | awk '/^Digest:/ {print $2; exit}')"
          ARM_DIGEST="$(printf '%s\n' "$ARM_INSPECT" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$AMD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARM_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          echo "Publishing GHCR multi-arch manifest:"
          echo "  linux/amd64: $AMD_IMAGE@$AMD_DIGEST"
          echo "  linux/arm64: $ARM_IMAGE@$ARM_DIGEST"
          echo "  target:      $MULTI_IMAGE"

          docker buildx imagetools create \
            --tag "$MULTI_IMAGE" \
            "$AMD_IMAGE@$AMD_DIGEST" \
            "$ARM_IMAGE@$ARM_DIGEST"

          INSPECT="$(docker buildx imagetools inspect "$MULTI_IMAGE")"
          printf '%s\n' "$INSPECT"
          printf '%s\n' "$INSPECT" | grep -F 'linux/amd64' >/dev/null
          printf '%s\n' "$INSPECT" | grep -F 'linux/arm64' >/dev/null
          MULTI_DIGEST="$(printf '%s\n' "$INSPECT" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$MULTI_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          mkdir -p out
          cat > out/runtime-${RELEASE_VERSION}-multiarch.provenance.env <<EOF
          BUILD_STATUS=VERIFIED_MULTIARCH
          RELEASE_VERSION=$RELEASE_VERSION
          BUILD_GIT_REPOSITORY=${GITHUB_REPOSITORY:-local}
          BUILD_GIT_SHA=${GITHUB_SHA:-local}
          BUILD_RUN_ID=${GITHUB_RUN_ID:-local}
          MULTI_IMAGE=$MULTI_IMAGE
          MULTI_DIGEST=$MULTI_DIGEST
          AMD64_IMAGE=$AMD_IMAGE
          AMD64_DIGEST=$AMD_DIGEST
          ARM64_IMAGE=$ARM_IMAGE
          ARM64_DIGEST=$ARM_DIGEST
          EOF

          echo "GHCR multi-arch VERIFIED: $MULTI_IMAGE@$MULTI_DIGEST"

      - name: Publish verified Alibaba Cloud ACR multi-arch manifest
        if: ${{ vars.PUBLISH_ALIYUN == 'true' }}
        shell: bash
        env:
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          set -euo pipefail
          source archinfra/releases/v1.36.4-r2.env

          : "${ALIYUN_REGISTRY:?organization variable ALIYUN_REGISTRY is required}"
          : "${ALIYUN_NAMESPACE:?organization variable ALIYUN_NAMESPACE is required}"
          : "${ALIYUN_USERNAME:?organization secret ALIYUN_USERNAME is required}"
          : "${ALIYUN_PASSWORD:?organization secret ALIYUN_PASSWORD is required}"

          AMD_IMAGE="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/kubernetes-runtime:${RELEASE_VERSION}-amd64"
          ARM_IMAGE="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/kubernetes-runtime:${RELEASE_VERSION}-arm64"
          MULTI_IMAGE="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/kubernetes-runtime:${RELEASE_VERSION}"

          printf '%s' "$ALIYUN_PASSWORD" | docker login \
            --username "$ALIYUN_USERNAME" \
            --password-stdin "$ALIYUN_REGISTRY"

          AMD_INSPECT="$(docker buildx imagetools inspect "$AMD_IMAGE")"
          ARM_INSPECT="$(docker buildx imagetools inspect "$ARM_IMAGE")"
          AMD_DIGEST="$(printf '%s\n' "$AMD_INSPECT" | awk '/^Digest:/ {print $2; exit}')"
          ARM_DIGEST="$(printf '%s\n' "$ARM_INSPECT" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$AMD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARM_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          docker buildx imagetools create \
            --tag "$MULTI_IMAGE" \
            "$AMD_IMAGE@$AMD_DIGEST" \
            "$ARM_IMAGE@$ARM_DIGEST"

          INSPECT="$(docker buildx imagetools inspect "$MULTI_IMAGE")"
          printf '%s\n' "$INSPECT"
          printf '%s\n' "$INSPECT" | grep -F 'linux/amd64' >/dev/null
          printf '%s\n' "$INSPECT" | grep -F 'linux/arm64' >/dev/null
          MULTI_DIGEST="$(printf '%s\n' "$INSPECT" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$MULTI_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          cat >> out/runtime-${RELEASE_VERSION}-multiarch.provenance.env <<EOF
          ALIYUN_MIRROR_STATUS=VERIFIED_MULTIARCH
          ALIYUN_MULTI_IMAGE=$MULTI_IMAGE
          ALIYUN_MULTI_DIGEST=$MULTI_DIGEST
          ALIYUN_AMD64_IMAGE=$AMD_IMAGE
          ALIYUN_AMD64_DIGEST=$AMD_DIGEST
          ALIYUN_ARM64_IMAGE=$ARM_IMAGE
          ALIYUN_ARM64_DIGEST=$ARM_DIGEST
          EOF

          echo "Aliyun ACR multi-arch VERIFIED: $MULTI_IMAGE@$MULTI_DIGEST"

      - name: Upload multi-arch provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-runtime-v1.36.4-r2-multiarch-provenance
          path: out/runtime-v1.36.4-r2-multiarch.provenance.env
          if-no-files-found: error
