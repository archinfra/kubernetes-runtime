name: Archinfra Kubernetes Docker Runtime r1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "archinfra/**"
      - "docker/**"
      - "registry/**"
      - "k8s/**"
      - ".github/workflows/archinfra-k8s-docker-r1.yml"
  push:
    branches:
      - main
    paths:
      - "archinfra/releases/v1.36.4-r1.env"
      - "archinfra/scripts/**"
      - "docker/**"
      - "registry/**"
      - "k8s/**"
      - ".github/workflows/archinfra-k8s-docker-r1.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: archinfra-kubernetes-runtime-v1.36.4-r1
  cancel-in-progress: false

env:
  RELEASE_FILE: ${{ github.workspace }}/archinfra/releases/v1.36.4-r1.env

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deterministic runtime release
        shell: bash
        run: |
          set -euo pipefail
          bash -n archinfra/scripts/build-k8s-docker.sh
          source archinfra/releases/v1.36.4-r1.env
          test "$RELEASE_VERSION" = "v1.36.4-r1"
          test "$ARCH" = "amd64"
          test "$RUNTIME_PROFILE" = "docker"
          test "$KUBERNETES_VERSION" = "1.36.4"
          test "$SEALOS_VERSION" = "5.1.1"
          test "$DOCKER_VERSION" = "28.5.2"
          test "$SEALOS_CACHE_DIGEST" != ""
          test "$DOCKER_CACHE_DIGEST" != ""
          test "$CRICTL_CACHE_DIGEST" != ""
          test "$KUBERNETES_CACHE_DIGEST" != ""
          echo "release lock validation OK"

  build:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deterministic build host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            buildah \
            skopeo \
            jq \
            file \
            uidmap \
            fuse-overlayfs
          buildah --version
          skopeo --version
          jq --version

      - name: Build and publish Cluster Image
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash archinfra/scripts/build-k8s-docker.sh

      - name: Upload runtime provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-runtime-v1.36.4-r1-provenance
          path: out/
          if-no-files-found: warn
